<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>匿名聊天室</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="wrapper">
        <!-- Left Sidebar: Conversation List -->
        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3>会话</h3>
            </div>
            <div class="sidebar-content">
                <div class="chat-item active" data-room="lobby">
                    <div class="chat-item-avatar">
                        <span>💬</span>
                    </div>
                    <div class="chat-item-info">
                        <div class="chat-item-name">大厅</div>
                        <div class="chat-item-preview">等待消息...</div>
                    </div>
                    <div class="chat-item-meta">
                        <span class="chat-item-time"></span>
                    </div>
                </div>
                <!-- Online users will be added here dynamically -->
                <div id="online-users-list" class="online-users">
                    <div class="sidebar-header">
                        <h3>在线用户</h3>
                    </div>
                    <div id="online-users-content"></div>
                </div>
            </div>
        </div>

        <!-- Right Chat Window -->
        <div id="chat-window" class="chat-window">
            <div class="chat-header">
                <div id="current-chat-title">大厅</div>
                <div id="current-chat-status">在线人数: <span id="online-count">0</span></div>
            </div>
            <div class="chat-messages" id="messages"></div>
            <div class="chat-input-wrapper">
                <form id="chat-form">
                    <div class="input-group">
                        <button type="button" id="file-btn" title="发送文件">
                            <input type="file" id="file-input" style="display: none;">
                            📎
                        </button>
                        <button type="button" id="audio-btn" title="录制语音">
                            🎤
                        </button>
                        <input type="text" id="message-input" placeholder="输入消息..." autocomplete="off">
                        <button type="submit" id="send-btn">发送</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Socket.IO client -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
